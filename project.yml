name: Murmur
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Replaced with the real Apple Team ID when building for TestFlight.
    DEVELOPMENT_TEAM: MURMURDEV0
    MURMUR_BUNDLE_ID: com.$(DEVELOPMENT_TEAM).murmur
    MURMUR_KEYCHAIN_GROUP: $(AppIdentifierPrefix)com.$(DEVELOPMENT_TEAM).murmur.shared
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Murmur:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/Core
      - path: Shared/Activity
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        MurmurKeychainGroup: $(MURMUR_KEYCHAIN_GROUP)
        NSMicrophoneUsageDescription: Murmur listens while you dictate. Your voice is turned into text on this iPhone and never leaves it.
        NSSpeechRecognitionUsageDescription: Murmur turns your speech into text on this iPhone. Nothing is sent anywhere.
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - murmur
    entitlements:
      path: App/Murmur.entitlements
      properties:
        keychain-access-groups:
          - $(MURMUR_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MURMUR_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MURMUR_APP
    dependencies:
      - target: MurmurKeyboard
        embed: true
        codeSign: true
      - target: MurmurWidget
        embed: true
        codeSign: true

  MurmurKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared/Core
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MurmurKeychainGroup: $(MURMUR_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-GB
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/MurmurKeyboard.entitlements
      properties:
        keychain-access-groups:
          - $(MURMUR_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MURMUR_BUNDLE_ID).Keyboard
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES

  MurmurWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared/Core
      - path: Shared/Activity
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MurmurKeychainGroup: $(MURMUR_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/MurmurWidget.entitlements
      properties:
        keychain-access-groups:
          - $(MURMUR_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MURMUR_BUNDLE_ID).Widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  Murmur:
    build:
      targets:
        Murmur: all
    run:
      config: Debug
    archive:
      config: Release
